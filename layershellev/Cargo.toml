[package]
name = "layershellev"
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
repository.workspace = true
readme = "README.md"
description = "extra shell binding for layershell with winit like eventloop"

[features]
default = []
foreign-toplevel = []
cosmic-toplevel = ["foreign-toplevel", "dep:cosmic-protocols"]
screencopy = ["foreign-toplevel"]
workspaces = ["dep:cosmic-protocols"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tempfile.workspace = true
thiserror.workspace = true
wayland-client.workspace = true

wayland-protocols.workspace = true

wayland-cursor.workspace = true

wayland-protocols-wlr.workspace = true

wayland-protocols-misc.workspace = true

wayland-backend.workspace = true

wayland-scanner.workspace = true

rwh_06.workspace = true

bitflags.workspace = true

calloop.workspace = true
calloop-wayland-source.workspace = true

log.workspace = true

waycrate_xkbkeycode.workspace = true

cosmic-protocols = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
wayland-server = "0.31"
wayland-protocols = { workspace = true, features = ["server"] }
wayland-protocols-wlr = { workspace = true, features = ["server"] }

[[test]]
name = "connection_lost"
harness = false
